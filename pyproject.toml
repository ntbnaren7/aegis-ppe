[project]
name = "aegis-ppe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ntbnaren7", email = "a.naren1308@gmail.com" }
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "opencv-python>=5.0.0.93",
    "psutil>=7.2.2",
    "torch",
    "torchaudio",
    "torchvision",
    "ultralytics>=8.4.123",
]

[project.scripts]
aegis-ppe = "aegis_ppe:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
